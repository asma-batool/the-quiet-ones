<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quiet Ones</title>
<meta name="description" content="An interactive bedtime story for kids about the robots and spacecraft NASA left on the Moon, on Mars and in deep space. NASA Space Apps Challenge 2026.">
<meta name="theme-color" content="#141938">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a storybook night. Art stage (16:9) sits above a paper
     dialogue page; on short landscape screens they sit side by side. */
  --night: #141938;
  --night-2: #0c1030;
  --paper: #fff6e8;
  --paper-edge: #f1dfc2;
  --ink: #2b2440;
  --ink-soft: #5d5475;
  --sun: #ffc94a;
  --laser: #5dffb0;
  --text-on-night: #f6f0e4;
  --font-display: 'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius: 22px;
  --line-size: clamp(1.08rem, 0.92rem + 0.75vw, 1.55rem);
  color-scheme: dark;
}
html.big-text { --line-size: clamp(1.3rem, 1.1rem + 1vw, 1.95rem); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 0%, #252b63 0%, var(--night) 55%, var(--night-2) 100%) fixed;
  color: var(--text-on-night);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; border-radius: 10px; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* ---------- top bar ---------- */
.topbar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) 16px 6px;
}
.topbar .right { justify-self: end; display: flex; gap: 8px; }
.chapter-label {
  font-family: var(--font-display); font-weight: 600; letter-spacing: .01em;
  font-size: clamp(.95rem, .8rem + .6vw, 1.25rem); color: #ffe7a1; text-align: center;
  text-wrap: balance;
}
.pill {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
  padding: 8px 16px; border-radius: 999px; border: 2px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.06); color: var(--text-on-night); font-weight: 700;
}
.pill:hover { background: rgba(255,255,255,.14); }
.pill[aria-pressed="true"] { background: var(--sun); color: var(--ink); border-color: var(--sun); }
.pill svg { width: 20px; height: 20px; flex: none; }
.pill .lbl-short { display: none; }

/* ---------- book: stage + page ---------- */
.main { min-height: 0; display: flex; padding: 6px 16px; overflow-y: auto; }
.book {
  width: min(100%, 1180px, calc((100vh - 310px) * 16 / 9));
  display: flex; flex-direction: column; gap: 12px; margin: auto;
}
@supports (height: 100dvh) { .book { width: min(100%, 1180px, calc((100dvh - 310px) * 16 / 9)); } }

.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden;
  background: var(--night-2);
  box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 18px 50px rgba(0,0,0,.45);
  cursor: pointer;
}
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .scene-in { animation: sceneIn .55s ease both; }
.stage .world { animation: kenburns 24s ease-in-out infinite alternate; transform-origin: 50% 55%; }
.stage.shake .world { animation: shake .9s cubic-bezier(.36,.07,.19,.97) both; }

.page {
  position: relative; background: var(--paper); color: var(--ink);
  border-radius: var(--radius); padding: 16px 20px 16px;
  box-shadow: 0 0 0 4px var(--paper-edge), 0 14px 34px rgba(0,0,0,.35);
  min-height: 132px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: start;
}
.portrait {
  width: 74px; height: 74px; border-radius: 50%; overflow: hidden; grid-row: span 2;
  background: #1d2350; box-shadow: 0 0 0 4px var(--who, #c9c3d8);
}
.portrait svg { width: 100%; height: 100%; display: block; }
.portrait.zoya { background: #3b3f86; }
.speaker {
  font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
  color: var(--ink); display: flex; align-items: center; gap: 8px; min-height: 26px;
}
.speaker .tag { background: var(--who, #c9c3d8); padding: 2px 12px; border-radius: 999px; }
.line {
  margin: 0; font-size: var(--line-size); line-height: 1.38; font-weight: 700; max-width: 62ch;
  text-wrap: pretty;
}
.line.fade { animation: lineIn .35s ease both; }
.actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions:empty { display: none; }
.act-btn {
  min-height: 48px; padding: 10px 20px; border-radius: 16px; border: 3px solid var(--ink);
  background: var(--laser); color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 1.1rem;
  box-shadow: 0 4px 0 var(--ink); transition: transform .08s;
}
.act-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.act-btn.pulse-btn { animation: btnPulse 1.6s ease-in-out infinite; }
.act-btn.secondary { background: #fff; }
.chip {
  min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px;
  border-radius: 999px; border: 2px solid var(--ink); background: #fff; color: var(--ink); font-weight: 800;
}
.chip .mini { width: 34px; height: 34px; border-radius: 50%; background: #1d2350; overflow: hidden; }
.chip .mini svg { width: 100%; height: 100%; }
.readout {
  font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; color: var(--ink);
  background: #fff; border: 2px dashed var(--ink-soft); padding: 8px 14px; border-radius: 14px;
  font-variant-numeric: tabular-nums;
}
.readout:empty { display: none; }
input[type=range].slider { width: min(100%, 360px); accent-color: #e2a72e; height: 36px; }

.card-btn {
  position: absolute; top: -18px; right: 18px; min-height: 40px;
  border-radius: 999px; border: 3px solid var(--ink); background: var(--sun); color: var(--ink);
  font-family: var(--font-display); font-weight: 600; padding: 4px 14px; box-shadow: 0 3px 0 var(--ink);
}

/* title & chapter pages */
.page.title-page { grid-template-columns: 1fr; text-align: left; }
.title-page h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em;
  font-size: clamp(2rem, 1.4rem + 3vw, 3.4rem); line-height: 1; color: var(--ink); text-wrap: balance;
}
.title-page p { margin: 6px 0 0; font-size: clamp(1rem, .9rem + .4vw, 1.2rem); color: var(--ink-soft); max-width: 60ch; font-weight: 700; }
.title-page .meta { font-size: .9rem; font-weight: 700; color: var(--ink-soft); }
.title-page .actions { margin-top: 10px; }
.chapter-page h2 { margin: 0; font-family: var(--font-display); font-size: clamp(1.6rem, 1.2rem + 2vw, 2.6rem); line-height: 1.05; color: var(--ink); text-wrap: balance; }
.chapter-page .kicker { font-family: var(--font-display); font-weight: 600; color: #b8791f; font-size: 1.05rem; }

/* ---------- controls ---------- */
.controls {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  padding: 8px 16px max(12px, env(safe-area-inset-bottom));
  width: min(100%, 1212px); margin: 0 auto;
}
.nav-btn {
  min-height: 52px; min-width: 52px; padding: 10px 22px; border-radius: 18px;
  font-family: var(--font-display); font-weight: 600; font-size: 1.15rem;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.nav-btn svg { width: 22px; height: 22px; }
#backBtn { background: transparent; color: var(--text-on-night); border: 3px solid rgba(255,255,255,.3); }
#nextBtn { background: var(--sun); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 #b8791f; }
#nextBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8791f; }
.nav-btn[disabled] { opacity: .35; cursor: default; }
.progress { height: 12px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; position: relative; }
.progress .bar { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #8fb6ff, var(--laser)); border-radius: 999px; transition: width .4s ease; }
.progress-wrap { display: grid; gap: 4px; }
.progress-text { font-size: .85rem; color: #c9c3d8; text-align: center; font-weight: 700; }
body.on-title .controls { display: none; }
@media (min-width: 900px) {
  #page:has(#startBtn) { grid-template-columns: 1fr auto; align-items: center; gap: 24px; }
  #page:has(#startBtn) .actions { flex-direction: column; align-items: stretch; margin: 0; grid-column: auto; }
}

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
  background: rgba(8,10,30,.72); padding: 16px; backdrop-filter: blur(3px);
}
.overlay.open { display: flex; }
.sheet {
  width: min(100%, 720px); max-height: calc(100% - 8px); overflow: auto; background: var(--paper); color: var(--ink);
  border-radius: 26px; box-shadow: 0 0 0 5px var(--paper-edge), 0 30px 80px rgba(0,0,0,.5);
  padding: 22px; position: relative; animation: pop .25s ease both;
}
.sheet h2 { font-family: var(--font-display); margin: 0; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2.1rem); line-height: 1.05; text-wrap: balance; }
.sheet h3 { font-family: var(--font-display); margin: 18px 0 6px; font-size: 1.2rem; }
.sheet p, .sheet li { font-size: 1.05rem; line-height: 1.45; font-weight: 600; }
.close-x {
  position: absolute; top: 12px; right: 12px; width: 48px; height: 48px; border-radius: 50%;
  border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 1.6rem; line-height: 1; font-weight: 800;
}
.card-head { display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: center; padding-right: 48px; }
.card-art { width: 130px; height: 130px; border-radius: 24px; background: #1d2350; overflow: hidden; box-shadow: 0 0 0 4px var(--who, #c9c3d8); }
.card-art svg { width: 100%; height: 100%; }
.card-real { margin: 4px 0 0; color: var(--ink-soft); font-weight: 800; font-size: .98rem; }
.status { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: .92rem; border: 2px solid var(--ink); }
.status.still { background: var(--laser); }
.status.quiet { background: #e4ddf7; }
.facts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 4px; }
.fact-box { background: #fff; border-radius: 16px; padding: 10px 12px; border: 2px solid var(--paper-edge); }
.fact-box b { display: block; font-family: var(--font-display); font-weight: 600; font-size: .85rem; color: #b8791f; text-transform: uppercase; letter-spacing: .04em; }
.fact-box span { font-weight: 700; font-size: .98rem; }
.sheet ul { padding-left: 1.2em; margin: 8px 0; }
.sheet a { color: #2f5fb3; font-weight: 800; }
.real-link { display: inline-flex; margin-top: 8px; padding: 10px 14px; border-radius: 14px; background: #eef3ff; border: 2px solid #c7d6f5; text-decoration: none; }

.menu-list { display: grid; gap: 10px; margin-top: 14px; }
.menu-list button {
  text-align: left; min-height: 52px; padding: 10px 16px; border-radius: 16px; border: 2px solid var(--paper-edge);
  background: #fff; color: var(--ink); font-weight: 800; font-size: 1.05rem; display: flex; gap: 12px; align-items: center;
}
.menu-list button .num { font-family: var(--font-display); background: var(--sun); border-radius: 10px; min-width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--ink); }
.menu-list button:hover { background: #fffaf1; border-color: #e7c98f; }
.toggles { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.toggles .pill { color: var(--ink); border-color: var(--paper-edge); background: #fff; }
.toggles .pill[aria-pressed="true"] { background: var(--sun); border-color: var(--ink); }

/* map */
.map-sheet { width: min(100%, 980px); }
.map-intro { margin: 6px 0 0; color: var(--ink-soft); }
.map-group { margin-top: 18px; }
.map-group h3 { display: flex; align-items: center; gap: 10px; }
.map-group h3 .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.map-item {
  border: 3px solid var(--paper-edge); background: #fff; border-radius: 20px; padding: 10px; color: var(--ink);
  display: grid; justify-items: center; gap: 6px; font-weight: 800; position: relative; min-height: 150px;
}
.map-item .mini { width: 86px; height: 86px; border-radius: 50%; background: #1d2350; overflow: hidden; }
.map-item .mini svg { width: 100%; height: 100%; }
.map-item.met { border-color: var(--ink); }
.map-item.met::after {
  content: 'Met!'; position: absolute; top: -10px; right: -6px; background: var(--laser); border: 2px solid var(--ink);
  border-radius: 999px; padding: 1px 9px; font-size: .8rem; transform: rotate(8deg);
}
.map-item:not(.met) .mini svg { filter: grayscale(.85) brightness(.75); }
.map-item small { font-weight: 700; color: var(--ink-soft); font-size: .8rem; text-align: center; }

/* ---------- SVG classes ---------- */
.ol { stroke: var(--ink); stroke-width: 3.5; stroke-linejoin: round; }
.svg-label { font-family: var(--font-display); font-weight: 600; }
.svg-num { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.tw { animation: twinkle 3.2s ease-in-out infinite; }
.win { animation: windowGlow 9s steps(1) infinite; }
.pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.blink { animation: blink 5.5s infinite; transform-box: fill-box; transform-origin: center; }
.bob { animation: bob 3.4s ease-in-out infinite; }
.bob-slow { animation: bob 5.5s ease-in-out infinite; }
.float-slow { animation: floaty 9s ease-in-out infinite; }
.drift { animation: drift 14s ease-in-out infinite alternate; }
.hover { animation: bob 2.4s ease-in-out infinite; }
.march { animation: march 1.4s linear infinite; }
.dust-drift { animation: dust 7s linear infinite; }
.walk { animation: bob 1.1s ease-in-out infinite; }
.wave-arm { animation: waveArm 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 10% 95%; }
.rotorA, .rotorB { transform-box: fill-box; transform-origin: center; }
.spinning .rotorA { animation: blade .16s linear infinite; }
.spinning .rotorB { animation: blade .16s linear infinite reverse; animation-delay: -.08s; }
#ingBody { transition: transform 1.2s cubic-bezier(.3,.7,.3,1); }
#ingBody.lifted { transform: translateY(-140px); }
.hit { cursor: pointer; }
.hit:focus-visible { outline: none; }
.hit:focus-visible > g { filter: drop-shadow(0 0 14px #ffe28a); }
.hit:hover > g { filter: drop-shadow(0 0 12px rgba(255,226,138,.85)); }

@keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes windowGlow { 0%,70% { opacity: .85; } 71%,100% { opacity: .3; } }
@keyframes pulse { 0%,100% { transform: scale(.82); opacity: .75; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes blink { 0%,93%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes floaty { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,-12px); } }
@keyframes drift { from { transform: translate(-30px, 10px) rotate(-2deg); } to { transform: translate(30px, -10px) rotate(2deg); } }
@keyframes march { to { stroke-dashoffset: -28; } }
@keyframes dust { from { transform: translateX(0); } to { transform: translateX(-120px); } }
@keyframes waveArm { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
@keyframes blade { 0% { transform: scaleX(1); } 50% { transform: scaleX(.06); } 100% { transform: scaleX(1); } }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.045) translate(-8px, -6px); } }
@keyframes shake { 10%,90% { transform: translate(-3px,1px); } 20%,80% { transform: translate(6px,-2px); } 30%,50%,70% { transform: translate(-9px,3px); } 40%,60% { transform: translate(9px,-3px); } }
@keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes lineIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes btnPulse { 0%,100% { box-shadow: 0 4px 0 var(--ink), 0 0 0 0 rgba(93,255,176,.7); } 50% { box-shadow: 0 4px 0 var(--ink), 0 0 0 10px rgba(93,255,176,0); } }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
html.calm *, html.calm *::before, html.calm *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }

/* ---------- responsive ---------- */
@media (max-width: 640px) {
  .stage { aspect-ratio: 3 / 2; }
  .stage.wide { aspect-ratio: 16 / 9; }
  .topbar { grid-template-columns: auto 1fr auto; padding-left: 10px; padding-right: 10px; gap: 8px; }
  .pill { padding: 8px 12px; }
  .pill .lbl-long { display: none; }
  .pill .lbl-short { display: inline; }
  .main { padding: 4px 10px; }
  .book { width: 100%; gap: 10px; }
  .stage { border-radius: 16px; }
  .page { padding: 14px 14px; grid-template-columns: auto 1fr; min-height: 0; }
  .portrait { width: 54px; height: 54px; grid-row: span 1; }
  .line { grid-column: 1 / -1; }
  .controls { padding-left: 10px; padding-right: 10px; gap: 10px; }
  .nav-btn { padding: 10px 14px; }
  .nav-btn .lbl { display: none; }
  #nextBtn .lbl { display: inline; }
  .facts-grid { grid-template-columns: 1fr; }
  .card-head { grid-template-columns: 88px 1fr; }
  .card-art { width: 88px; height: 88px; }
  .card-btn { top: -16px; right: 12px; font-size: .9rem; }
  .main { overflow-y: auto; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .topbar { padding-top: 6px; padding-bottom: 2px; }
  .main { padding: 4px 12px; }
  .book {
    width: 100%; flex-direction: row; align-items: stretch; height: calc(100vh - 128px);
  }
  @supports (height: 100dvh) { .book { height: calc(100dvh - 128px); } }
  .stage { width: auto; height: calc(100vh - 128px); flex: none; }
  @supports (height: 100dvh) { .stage { height: calc(100dvh - 128px); } }
  .page { flex: 1; min-width: 0; overflow-y: auto; min-height: 0; grid-template-columns: auto 1fr; align-content: start; }
  .card-btn { position: static; grid-column: 1 / -1; justify-self: start; order: 9; }
  .portrait { width: 48px; height: 48px; grid-row: span 1; }
  .line { grid-column: 1 / -1; font-size: clamp(1rem, .8rem + 1.4vh, 1.25rem); }
  .controls { padding-top: 4px; padding-bottom: 6px; }
  .nav-btn { min-height: 44px; }
  .title-page h1 { font-size: 1.8rem; }
}

</style>
</head>
<body class="on-title">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false" id="globalDefs"></svg>
<div id="app">
  <header class="topbar">
    <div><button class="pill" id="menuBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span class="lbl-long">Menu</span><span class="lbl-short">Menu</span></button></div>
    <div class="chapter-label" id="chapterLabel">The Quiet Ones</div>
    <div class="right"><button class="pill" id="voiceBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <span class="lbl-long">Read to me</span><span class="lbl-short">Read</span></button></div>
  </header>
  <main class="main">
    <div class="book">
      <div class="stage" id="stage" aria-label="Story picture. Tap to turn the page."></div>
      <section class="page" id="page" aria-live="polite"></section>
    </div>
  </main>
  <nav class="controls" aria-label="Story controls">
    <button class="nav-btn" id="backBtn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Back</span></button>
    <div class="progress-wrap">
      <div class="progress" role="progressbar" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div>
      <div class="progress-text" id="progText"></div>
    </div>
    <button class="nav-btn" id="nextBtn" type="button"><span class="lbl">Next</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

const INK = '#2b2440';

function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function sparkle(x, y, r, cls = '', fill = '#fff') {
  return `<path class="${cls}" fill="${fill}" d="M${x},${y - r} Q${x},${y} ${x + r},${y} Q${x},${y} ${x},${y + r} Q${x},${y} ${x - r},${y} Q${x},${y} ${x},${y - r} Z"/>`;
}

function face(x, y, s = 1, mood = 'happy') {
  const ex = 22 * s;
  let eyes;
  if (mood === 'calm' || mood === 'rest') {
    eyes = `<path d="M${x - ex - 9 * s},${y} q${9 * s},${7 * s} ${18 * s},0 M${x + ex - 9 * s},${y} q${9 * s},${7 * s} ${18 * s},0" stroke="${INK}" stroke-width="${3.4 * s}" fill="none" stroke-linecap="round"/>`;
  } else {
    eyes = `<g class="blink"><ellipse cx="${x - ex}" cy="${y}" rx="${6.5 * s}" ry="${8.5 * s}" fill="${INK}"/><ellipse cx="${x + ex}" cy="${y}" rx="${6.5 * s}" ry="${8.5 * s}" fill="${INK}"/><circle cx="${x - ex + 2.3 * s}" cy="${y - 3.2 * s}" r="${2.5 * s}" fill="#fff"/><circle cx="${x + ex + 2.3 * s}" cy="${y - 3.2 * s}" r="${2.5 * s}" fill="#fff"/></g>`;
  }
  let mouth;
  if (mood === 'wow') mouth = `<ellipse cx="${x}" cy="${y + 17 * s}" rx="${5 * s}" ry="${6.5 * s}" fill="${INK}"/>`;
  else if (mood === 'rest') mouth = `<path d="M${x - 6 * s},${y + 15 * s} q${6 * s},${4 * s} ${12 * s},0" stroke="${INK}" stroke-width="${3 * s}" fill="none" stroke-linecap="round"/>`;
  else mouth = `<path d="M${x - 9 * s},${y + 13 * s} q${9 * s},${10 * s} ${18 * s},0" stroke="${INK}" stroke-width="${3.2 * s}" fill="none" stroke-linecap="round"/>`;
  const blush = `<ellipse cx="${x - ex - 11 * s}" cy="${y + 11 * s}" rx="${8 * s}" ry="${5 * s}" fill="#ff8fa3" opacity=".55"/><ellipse cx="${x + ex + 11 * s}" cy="${y + 11 * s}" rx="${8 * s}" ry="${5 * s}" fill="#ff8fa3" opacity=".55"/>`;
  return `<g class="face">${blush}${eyes}${mouth}</g>`;
}

/* Position lives on the outer <g>; animation classes go on an inner <g>,
   because a CSS transform animation would override the SVG transform attribute. */
function place(markup, x, y, s = 1, extra = '') {
  return `<g transform="translate(${x} ${y}) scale(${s})"><g ${extra}>${markup}</g></g>`;
}

/* ---------- backgrounds ---------- */
function stars(n, seed, w = 1600, h = 900, minR = .8, maxR = 2.6) {
  const r = rng(seed); let out = '';
  for (let i = 0; i < n; i++) {
    const x = r() * w, y = r() * h, rad = minR + r() * r() * (maxR - minR);
    const delay = (r() * 4).toFixed(2), op = (.45 + r() * .55).toFixed(2);
    out += `<circle class="tw" style="animation-delay:-${delay}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(2)}" fill="#fff" opacity="${op}"/>`;
  }
  for (let i = 0; i < Math.max(2, n / 40); i++) out += sparkle(r() * w, r() * h * .8, 7 + r() * 6, 'tw', '#fff');
  return out;
}

function moonDisc(cx, cy, R, withGlow = true) {
  const craters = [[-.35, -.25, .16], [.25, -.38, .1], [.32, .12, .2], [-.15, .35, .13], [-.45, .2, .08], [.05, -.05, .07], [.55, -.1, .06]];
  return `${withGlow ? `<circle cx="${cx}" cy="${cy}" r="${R * 1.9}" fill="url(#gGlow)"/>` : ''}
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#gMoonFace)"/>
  ${craters.map(([a, b, c]) => `<circle cx="${cx + a * R}" cy="${cy + b * R}" r="${c * R}" fill="#c9c2b6" opacity=".7"/><circle cx="${cx + a * R + c * R * .15}" cy="${cy + b * R + c * R * .15}" r="${c * R * .75}" fill="#d9d3c8" opacity=".6"/>`).join('')}
  <path d="M${cx - R * .55},${cy - R * .55} q${R * .3},${-R * .2} ${R * .6},${-R * .22}" stroke="#fff" stroke-width="${R * .05}" fill="none" stroke-linecap="round" opacity=".55"/>`;
}

  <path d="M${cx + R * .15},${cy + R * .05} q${R * .3},-${R * .15} ${R * .5},${R * .1} q0,${R * .35} -${R * .3},${R * .45} q-${R * .2},-${R * .15} -${R * .2},-${R * .55} Z" fill="#7bd389"/>
  <path d="M${cx - R * .7},${cy + R * .3} q${R * .4},-${R * .12} ${R * .8},${R * .05}" stroke="#fff" stroke-width="${R * .07}" fill="none" stroke-linecap="round" opacity=".75"/>
  <path d="M${cx - R * .2},${cy - R * .75} q${R * .4},-${R * .1} ${R * .7},${R * .1}" stroke="#fff" stroke-width="${R * .06}" fill="none" stroke-linecap="round" opacity=".7"/>`;
}

function marsDisc(cx, cy, R, glow = true) {

function footprints([x, y, n = 6, dx = 46, dy = 6]) {
  let out = '';

    const fx = x + i * dx, fy = y + i * dy + (i % 2 ? 14 : 0);
    out += `<ellipse cx="${fx}" cy="${fy}" rx="13" ry="6" fill="#6f6c7a" opacity=".7"/><path d="M${fx - 9},${fy} h18" stroke="#5c5967" stroke-width="2" opacity=".6"/>`;
  }

}

function karachiSkyline() {
  const r = rng(42); let b = '';
  let x = -20;
  while (x < 1620) {
    const w = 70 + r() * 110, h = 120 + r() * 210;
    b += `<rect x="${x.toFixed(0)}" y="${(700 - h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="#1c2152"/>`;
    for (let wy = 700 - h + 18; wy < 680; wy += 30) for (let wx = x + 12; wx < x + w - 18; wx += 24)
      if (r() > .62) b += `<rect class="win" style="animation-delay:-${(r() * 9).toFixed(1)}s" x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="10" height="13" rx="2" fill="#ffd27a" opacity="${(.55 + r() * .45).toFixed(2)}"/>`;
    x += w + 6;
  }
  const mosque = `<g fill="#171b47">
    <rect x="300" y="470" width="14" height="230"/><path d="M292,470 h30 l-15,-36 z"/><circle cx="307" cy="430" r="4" fill="#ffd27a"/>
    <rect x="520" y="470" width="14" height="230"/><path d="M512,470 h30 l-15,-36 z"/><circle cx="527" cy="430" r="4" fill="#ffd27a"/>
    <path d="M340,600 C340,520 400,490 417,480 C434,490 494,520 494,600 Z"/><rect x="330" y="598" width="174" height="102"/>
    <rect x="414" y="460" width="6" height="22"/></g>`;
  return b + mosque;
}

  ingenuity: { fn: () => ingenuity(), vb: '-170 -340 340 340' },
  pioneer:   { fn: () => pioneer(), vb: '-170 -170 340 340' },

  insight:   { fn: () => phoenix({ insight: true }), vb: '-230 -190 520 220' },

  narrator:  { fn: () => `${sparkle(0, 0, 60, '', '#ffd54d')}`, vb: '-80 -80 160 160' }
};

function portraitSVG(id) {
  const p = PORTRAITS[id] || PORTRAITS.narrator;
  return `<svg viewBox="${p.vb}" aria-hidden="true" focusable="false">${p.fn()}</svg>`;

/* ============================================================
   THE QUIET ONES — sounds + interactions
   Every interaction: lives in the page (big buttons on phones),
   animates the SVG in the stage, never blocks "Next", and jumps
   straight to the result when motion is reduced.
   ============================================================ */

const SFX = {
  ctx: null, on: true,
  ac() { if (!this.on) return null; try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; } catch (e) { return null; } },
  tone(f1, f2, dur, type = 'sine', vol = .07, delay = 0) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  },
  laser() { this.tone(1400, 300, .35, 'square', .04); },
  ding() { this.tone(880, 0, .5, 'sine', .08); this.tone(1320, 0, .6, 'sine', .06, .12); },
  pop() { this.tone(520, 880, .12, 'sine', .06); },
  rumble() {
    const c = this.ac(); if (!c) return;
    const len = c.sampleRate * 1.2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'lowpass'; f.frequency.value = 140; g.gain.value = .5; s.buffer = buf; s.connect(f).connect(g).connect(c.destination); s.start();
  },
  whirr(dur) {
    const c = this.ac(); if (!c) return null;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = 'sawtooth'; o.frequency.value = 95; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.025, t + .3);
    g.gain.setValueAtTime(.025, t + dur - .4); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .1);
  }
};

function mkBtn(label, cls = 'act-btn pulse-btn') { const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = label; return b; }
function mkReadout() { const r = document.createElement('div'); r.className = 'readout'; r.setAttribute('aria-live', 'polite'); return r; }
function tween(dur, step, done, reduced) {
  if (reduced) { step(1); done && done(); return () => {}; }
  let raf, t0 = performance.now(), dead = false;
  const f = (now) => { if (dead) return; const p = Math.min(1, (now - t0) / dur); step(p); if (p < 1) raf = requestAnimationFrame(f); else done && done(); };
  raf = requestAnimationFrame(f);
  return () => { dead = true; cancelAnimationFrame(raf); };
}
const easeInOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

const INTERACTIONS = {
  laser(c) {
    const b = mkBtn('Fire the laser!'), out = mkReadout();
    c.actions.append(b, out);
    const $ = s => c.svg.querySelector(s);
    const outL = $('#beamOut'), backL = $('#beamBack'), hit = $('#hitGlow'), box = $('#timerBox'), txt = $('#timerText');
    const len = Math.hypot(1272 - 420, 500 - 215);
    let stop = () => {};
    b.onclick = (e) => {
      e.stopPropagation(); b.disabled = true; b.classList.remove('pulse-btn'); out.textContent = '';
      SFX.laser();
      [outL, backL].forEach(l => { l.setAttribute('stroke-dasharray', len); l.setAttribute('stroke-dashoffset', len); l.setAttribute('opacity', 1); });
      box.setAttribute('opacity', 1); hit.setAttribute('opacity', 0);
      stop = tween(2500, p => {
        const t = p * 2.5;
        txt.textContent = t.toFixed(2) + ' s';
        if (p < .5) outL.setAttribute('stroke-dashoffset', len * (1 - p / .5));
        else {
          outL.setAttribute('stroke-dashoffset', 0); hit.setAttribute('opacity', 1);
          backL.setAttribute('stroke-dashoffset', len * (1 - (p - .5) / .5));
        }
      }, () => {
        txt.textContent = '2.50 s'; SFX.ding();
        out.textContent = 'Back in 2.5 seconds! The light zoomed to the Moon and back: about 768,800 km.';
        b.disabled = false; b.textContent = 'Fire again!';
        setTimeout(() => { [outL, backL, hit].forEach(l => l && l.setAttribute('opacity', 0)); }, 1200);
      }, c.reduced);
    };
    return () => stop();
  },

  quake(c) {
    const b = mkBtn('Make a moonquake!'), out = mkReadout();
    c.actions.append(b, out);
    const line = c.svg.querySelector('#seisLine'); let stop = () => {};
    const draw = (amp, ph) => {
      let pts = [];
      for (let i = 0; i <= 70; i++) { const x = 30 + i * 8; const env = Math.exp(-Math.pow((x - 230) / 170, 2)); pts.push(`${x},${(140 + Math.sin(i * 1.7 + ph) * amp * env * (0.6 + 0.4 * Math.sin(i * .5))).toFixed(1)}`); }
      line.setAttribute('points', pts.join(' '));
    };
    b.onclick = (e) => {
      e.stopPropagation(); b.classList.remove('pulse-btn'); out.textContent = '';
      SFX.rumble();
      c.stage.classList.remove('shake'); void c.stage.offsetWidth; c.stage.classList.add('shake');
      stop = tween(2200, p => draw(70 * (1 - p), p * 40), () => {
        draw(0, 0);

    const b = mkBtn('Open the map'); b.onclick = (e) => { e.stopPropagation(); c.api.openMap(); };

  }

    S[k] = !S[k]; store.set(k, S[k]);
    if (k === 'sfx') SFX.on = S.sfx;
    if (k === 'big') document.documentElement.classList.toggle('big-text', S.big);
    if (k === 'calm') document.documentElement.classList.toggle('calm', S.calm);
    if (k === 'voice') { $('#voiceBtn').setAttribute('aria-pressed', S.voice); if (S.voice) { const sc = SCENES[S.i]; if (sc.lines) speak(sc.lines[S.line].text, sc.lines[S.line].who); } else hush(); }
  }

  $('#menuBtn').onclick = openMenu;
  $('#voiceBtn').onclick = () => toggle('voice');
  $('#voiceBtn').setAttribute('aria-pressed', S.voice);

  /* ---------- start ---------- */
  window.QO = { render, next, back, openCard, openMap, openAbout, openMenu, closeOverlays, count: SCENES.length, scenes: SCENES };
  const m = /^#chapter-(\d)$/.exec(location.hash);
  if (m && chapterStart(+m[1]) >= 0) render(chapterStart(+m[1]));
  else render(0);
  if (location.hash === '#map') openMap();
})();

</script>
</body>
</html>
